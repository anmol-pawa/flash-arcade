name: Query Clash CI

on:
  push:
    paths: ["sql-battle/**", ".github/workflows/sql-battle.yml"]
  pull_request:
    paths: ["sql-battle/**", ".github/workflows/sql-battle.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sql-battle
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sql-battle/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Runs every mission's Oracle and PostgreSQL answer on a real PGlite
      # database and checks they agree, plus the transpiler suite.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
